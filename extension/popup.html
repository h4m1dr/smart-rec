<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<style>
  body { width: 300px; margin: 0; padding: 14px; background: #0f172a; color: #f8fafc; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; }
  .hdr { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; padding-bottom: 8px; margin-bottom: 8px; }
  .badge { background: #334155; color: #cbd5e1; padding: 2px 8px; border-radius: 5px; font-size: 10px; font-weight: bold; }
  .box { background: #1e293b; padding: 8px; border-radius: 6px; margin-bottom: 8px; color: #94a3b8; font-size: 11px; line-height: 1.5; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 8px; text-align: center; font-size: 11px; }
  .card { background: #1e293b; padding: 5px; border-radius: 6px; }
  .card strong { font-size: 14px; display: block; margin-top: 2px; }
  #log { background: #020617; color: #10b981; padding: 6px 8px; border-radius: 5px; font-size: 10px; margin-bottom: 10px; border: 1px solid #1e293b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .btn { width: 100%; border: none; padding: 9px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px; margin-bottom: 6px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
</style>
</head>
<body>
  <div class="hdr">
    <strong style="color:#38bdf8;font-size:13px;">⚛️ SMART-REC v4.0</strong>
    <span id="p-badge" class="badge">IDLE</span>
  </div>
  <div id="p-tech" class="box">Connecting to active tab...</div>
  <div class="grid3">
    <div class="card">Pages<strong id="p-pages" style="color:#38bdf8;">0</strong></div>
    <div class="card">Modals<strong id="p-modals" style="color:#a855f7;">0</strong></div>
    <div class="card">APIs<strong id="p-apis" style="color:#10b981;">0</strong></div>
  </div>
  <div id="log">Ready</div>

  <div id="p-init">
    <button id="btn-fresh" class="btn" style="background:#10b981;color:#0f172a;">🚀 Start Fresh</button>
    <button id="btn-cont" class="btn" style="background:#3b82f6;color:#fff;">📂 Continue Existing</button>
  </div>

  <div id="p-active" class="row2" style="display:none;">
    <button id="btn-save" class="btn" style="background:#10b981;color:#0f172a;">💾 Save</button>
    <button id="btn-stop" class="btn" style="background:#ef4444;color:#fff;">⏹ Stop</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<style>
  body { width: 320px; margin: 0; padding: 14px; background: #0f172a; color: #f8fafc; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; }
  .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; padding-bottom: 8px; margin-bottom: 10px; }
  .badge { background: #334155; color: #cbd5e1; padding: 2px 8px; border-radius: 5px; font-size: 10px; font-weight: bold; }
  .box { background: #1e293b; padding: 8px; border-radius: 6px; margin-bottom: 8px; color: #94a3b8; font-size: 11px; line-height: 1.5; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; text-align: center; }
  .stat-card { background: #1e293b; padding: 6px; border-radius: 6px; }
  .stat-card strong { font-size: 15px; display: block; margin-top: 2px; }
  .btn { width: 100%; border: none; padding: 8px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 11px; margin-bottom: 6px; transition: opacity 0.15s; }
  .btn:hover { opacity: 0.9; }
  .btn-whitelist { background: #38bdf8; color: #0f172a; }
  .btn-fresh { background: #10b981; color: #0f172a; }
  .btn-cont { background: #3b82f6; color: #fff; }
  .btn-save { background: #10b981; color: #0f172a; }
  .btn-stop { background: #ef4444; color: #fff; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  #log { background: #020617; color: #38bdf8; padding: 6px; border-radius: 5px; font-size: 10px; margin-bottom: 8px; border: 1px solid #1e293b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wl-box { max-height: 60px; overflow-y: auto; background: #020617; padding: 5px 7px; border-radius: 5px; border: 1px solid #1e293b; font-size: 10px; color: #64748b; margin-bottom: 8px; }
  input { width: 100%; box-sizing: border-box; background: #020617; border: 1px solid #334155; color: #fff; padding: 6px; border-radius: 4px; font-size: 11px; margin-bottom: 5px; }
</style>
</head>
<body>
  <div class="header">
    <strong style="color:#38bdf8;font-size:13px;">⚛️ SMART-REC v6.0</strong>
    <span id="status-badge" class="badge">STANDBY</span>
  </div>

  <div id="domain-box" class="box">
    Site: <b id="cur-domain" style="color:#fff;">...</b><br>
    <span id="wl-status">Checking site status...</span>
  </div>

  <button id="btn-toggle-wl" class="btn btn-whitelist">🔍 Analyze & Enable on This Site</button>

  <div id="controls-section" style="display:none;">
    <div id="stack-info" class="box">Scanning site...</div>
    <div class="stats">
      <div class="stat-card">Pages Saved<strong id="p-count" style="color:#38bdf8;">0</strong></div>
      <div class="stat-card">Modals Saved<strong id="m-count" style="color:#a855f7;">0</strong></div>
    </div>
    <div id="log">Ready</div>

    <div id="init-view">
      <button id="btn-fresh" class="btn btn-fresh">🚀 Start Fresh</button>
      <button id="btn-continue" class="btn btn-cont">📂 Continue Existing</button>
    </div>

    <div id="active-view" style="display:none;">
      <div class="row">
        <button id="btn-save" class="btn btn-save">💾 Save</button>
        <button id="btn-stop" class="btn btn-stop">⏹ Stop</button>
      </div>
    </div>
  </div>

  <div style="font-size:10px;color:#94a3b8;margin-bottom:3px;">Whitelisted Domains:</div>
  <div id="wl-list" class="wl-box">None</div>

  <div style="border-top:1px solid #1e293b;padding-top:6px;">
    <input type="password" id="api-key" placeholder="Optional Gemini API Key (AIza...)" />
    <button id="btn-save-key" class="btn" style="background:#334155;color:#cbd5e1;padding:5px;margin:0;">💾 Save AI Key</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>

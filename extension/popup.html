<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<style>
  body { width: 340px; margin: 0; padding: 14px; background: #0f172a; color: #f8fafc; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11px; }
  .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; padding-bottom: 8px; margin-bottom: 10px; }
  .badge { background: #10b981; color: #0f172a; padding: 2px 8px; border-radius: 5px; font-size: 10px; font-weight: bold; }
  .box { background: #1e293b; padding: 9px; border-radius: 6px; margin-bottom: 8px; color: #cbd5e1; line-height: 1.5; }
  .btn { width: 100%; border: none; padding: 8px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 11px; margin-bottom: 6px; }
  .btn-primary { background: #38bdf8; color: #0f172a; }
  .site-card { background: #020617; border: 1px solid #1e293b; padding: 6px 8px; border-radius: 5px; margin-bottom: 5px; display: flex; justify-content: space-between; align-items: center; }
  .tag { display: inline-block; background: #334155; color: #38bdf8; padding: 1px 5px; border-radius: 3px; font-size: 9px; margin-right: 3px; margin-top: 2px; }
  input { width: 100%; box-sizing: border-box; background: #020617; border: 1px solid #334155; color: #fff; padding: 6px; border-radius: 4px; font-size: 11px; margin-bottom: 5px; }
</style>
</head>
<body>
  <div class="header">
    <strong style="color:#38bdf8;font-size:13px;">⚛️ SMART-REC v8.0</strong>
    <span class="badge">PERSISTENT</span>
  </div>

  <div class="box">
    Current Domain: <b id="cur-domain" style="color:#38bdf8;">...</b>
    <div id="passport-preview" style="margin-top:4px;font-size:10px;color:#94a3b8;">Ready to analyze.</div>
  </div>

  <button id="btn-analyze" class="btn btn-primary">🔍 Analyze Site & Open Architect Panel</button>

  <div style="border-top:1px solid #1e293b;padding-top:8px;margin-top:6px;margin-bottom:8px;">
    <div style="font-size:10px;color:#94a3b8;margin-bottom:4px;">🔑 Gemini API Token (For Built-in AI Chat & Auto-Build):</div>
    <input type="password" id="inp-token" placeholder="Paste Gemini API Key (AIzaSy...)" />
    <button id="btn-save-token" class="btn" style="background:#10b981;color:#0f172a;margin:0;padding:6px;">💾 Save AI Token</button>
  </div>

  <div style="display:flex;justify-content:space-between;align-items:center;margin:8px 0 4px 0;">
    <span style="color:#94a3b8;font-weight:bold;">Analyzed Sites Registry:</span>
    <span id="btn-export-reg" style="color:#38bdf8;cursor:pointer;font-size:10px;">📥 Backup List</span>
  </div>
  <div id="registry-list" style="max-height:110px;overflow-y:auto;"></div>

  <script src="popup.js"></script>
</body>
</html>

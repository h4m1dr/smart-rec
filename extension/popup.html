<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<style>
  body { width: 350px; margin: 0; padding: 12px; background: #0f172a; color: #f8fafc; font-family: ui-monospace, Consolas, monospace; font-size: 11px; }
  .tabs { display: flex; border-bottom: 1px solid #1e293b; margin-bottom: 10px; }
  .tab { flex: 1; padding: 6px; text-align: center; cursor: pointer; color: #94a3b8; font-weight: bold; border-bottom: 2px solid transparent; }
  .tab.active { color: #38bdf8; border-bottom-color: #38bdf8; }
  .pane { display: none; }
  .pane.active { display: block; }
  .box { background: #1e293b; padding: 8px; border-radius: 6px; margin-bottom: 8px; line-height: 1.4; color: #cbd5e1; }
  .btn { width: 100%; border: none; padding: 8px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 11px; margin-bottom: 6px; }
  .btn-pri { background: #38bdf8; color: #0f172a; }
  .btn-succ { background: #10b981; color: #0f172a; }
  .btn-upd { background: #8b5cf6; color: #fff; }
  .site-row { background: #020617; border: 1px solid #1e293b; padding: 5px 8px; border-radius: 4px; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
</style>
</head>
<body>
  <div class="tabs">
    <div class="tab active" data-target="pane-main">⚡ Control Hub</div>
    <div class="tab" data-target="pane-settings">⚙️ Settings & Backup</div>
  </div>

  <!-- PANE 1 -->
  <div id="pane-main" class="pane active">
    <div class="box">
      Domain: <b id="cur-domain" style="color:#38bdf8;">...</b><br>
      <span id="domain-state">Checking status...</span>
    </div>
    <button id="btn-toggle-site" class="btn btn-pri">🔍 Enable / Open Panel on Site</button>
    <div style="margin-top:10px;font-weight:bold;color:#94a3b8;margin-bottom:4px;">Analyzed Sites Registry:</div>
    <div id="registry-list" style="max-height:120px;overflow-y:auto;"></div>
  </div>

  <!-- PANE 2 -->
  <div id="pane-settings" class="pane">
    <div class="box">
      <b>📁 Central Workspace Directory:</b>
      <div id="path-display" style="color:#38bdf8;font-size:10px;word-break:break-all;margin:4px 0;">Default Prompt Workspace</div>
      <button id="btn-change-path" class="btn" style="background:#334155;color:#fff;margin:0;padding:5px;">Change Workspace Folder</button>
    </div>

    <div class="box">
      <b>💾 Comprehensive Backup (Projects + Registry + File Lists):</b>
      <div style="display:flex;gap:6px;margin-top:6px;">
        <button id="btn-backup" class="btn btn-succ" style="margin:0;padding:6px;">📥 Export Full Backup</button>
        <button id="btn-restore" class="btn" style="background:#475569;color:#fff;margin:0;padding:6px;">📤 Restore Backup</button>
        <input type="file" id="inp-file" style="display:none;" accept=".json" />
      </div>
    </div>

    <div class="box" style="border:1px solid #8b5cf6;">
      <b>🔄 GitHub Auto-Updater:</b>
      <div style="font-size:10px;color:#94a3b8;margin:4px 0;">Downloads latest extension package from GitHub.</div>
      <button id="btn-github-upd" class="btn btn-upd" style="margin:0;">🚀 Download Latest from GitHub</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
